name: Add sadhana audio and titles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[sadhana-updated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update sadhana page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'function sadhana\(\)\{.*?\nfunction song\(\)\{'
          replacement = '''function sadhana(){
 const p=lyrics.slice(page*4,page*4+4);
 const sectionTitles={
  0:'大手印之見、修、行、果',
  4:'三昧耶、生起次第與圓滿次第',
  8:'三寶與皈依',
  12:'菩提心與顯空不二',
  16:'二元執著與本尊顯現',
  20:'身之寂靜與自在安住',
  24:'頂禮與供養',
  28:'懺悔',
  32:'隨喜',
  36:'祈請與迴向',
  40:'直指顯相即心',
  44:'直指心即空性',
  48:'直指自性任運',
  52:'一切顯相與覺受自解脫',
  56:'三門清淨',
  60:'破除沙門與梵志之概念',
  64:'第三灌究竟行持',
  68:'十六喜與薈供',
  72:'金剛歌與金剛舞',
  80:'大印薈供',
  88:'根道果吉祥'
 };
 const title=sectionTitles[page*4]?'<div class="section-title">'+sectionTitles[page*4]+'</div>':'';
 main.innerHTML='<button class="back" id="back">← 回首頁</button><div class="card audio-card"><div class="audio-label">🎵 大手印儀軌｜喜樂之舞</div><audio controls preload="metadata" src="喜樂之舞_全_剪_GitHub版.mp3"></audio></div>'+title+'<div class="card lyrics">'+p.map(function(x){return '<div class="line">'+x+'</div>'}).join('')+'</div><div class="navrow"><button class="nav" id="prev">← 上一頁</button><button class="nav next" id="next">下一頁 →</button></div><div class="count">第 '+(page+1)+' / '+total+' 頁</div>';
 document.getElementById('back').addEventListener('click',back);document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=total-1;
 document.getElementById('prev').addEventListener('click',function(){if(page>0){page--;render()}});document.getElementById('next').addEventListener('click',function(){if(page<total-1){page++;render()}});
}
function song(){'''
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected 1 sadhana function replacement, got {n}')
          ns=ns.replace('.audio-card{padding:14px 16px;margin-bottom:12px}', '.audio-card{padding:14px 16px;margin-bottom:12px}.section-title{font-size:18px;font-weight:600;letter-spacing:.08em;margin:16px 4px 10px;color:var(--accent)}')
          p.write_text(ns,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add sadhana audio and section titles [sadhana-updated]'
          git push
